[project]
name = "hakaton-kek"
version = "0.1.0"
description = "Культурный пульс — аналитика сети центров прототипирования вузов культуры"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115,<1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8,<10",
    "ruff>=0.12,<1.0",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Пакет `app` живёт в backend/ — оттуда его и импортируют тесты.
pythonpath = ["backend"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
