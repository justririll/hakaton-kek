[project]
name = "culture-pulse-backend"
version = "0.1.0"
description = "Аналитическая платформа учреждений культуры: динамика, кластеризация аудитории, рекомендации по программированию"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pandas>=2.2",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "pydantic>=2.7",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.2",
]

[dependency-groups]
# Тесты запускаются отсюда: uv run pytest ../tests
dev = [
    "pytest>=8,<10",
    "httpx>=0.28,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
