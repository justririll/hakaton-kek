services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: culture-pulse-backend
    restart: unless-stopped
    environment:
      - CULTURE_PULSE_DATA=/app/DATASET
      # Ключ берётся из .env рядом с этим файлом и в репозиторий не попадает.
      # Без ключа AI-слой выключается, остальная витрина работает как обычно.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-flash-lite-latest}
    expose:
      - "8010"
    ports:
      - "8010:8010"

  frontend:
    build:
      context: .
      dockerfile: frontend-ml/Dockerfile
    container_name: culture-pulse-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
