# HTTP: обслуживает проверку Let's Encrypt и уводит остальное на HTTPS.
server {
    listen 80;
    server_name vitaliysoftware.duckdns.org;

    # Каталог общий с контейнером certbot — через него проходит webroot-проверка
    # при выпуске и продлении сертификата.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Обращения по IP или чужому имени: сертификат на них не выписан, поэтому
# отвечаем на HTTP и не заставляем браузер ругаться на несовпадение имени.
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        proxy_pass http://backend:8010/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Шрифты и сборка лежат под уникальными именами, поэтому кэшируются надолго;
    # index.html — никогда, иначе браузер держит ссылки на старую сборку.
    location /fonts/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name vitaliysoftware.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/vitaliysoftware.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vitaliysoftware.duckdns.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    location /api/ {
        proxy_pass http://backend:8010/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Конвейер пересобирается секунды, а AI-бриф ходит во внешний сервис:
        # короткий таймаут рвал бы ответ на середине.
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Шрифты и сборка лежат под уникальными именами, поэтому кэшируются надолго;
    # index.html — никогда, иначе браузер держит ссылки на старую сборку.
    location /fonts/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
}
